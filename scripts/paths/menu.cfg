# The Xbox main menu on the ui scenario (docs/39-main-menu.md): `menu 1` swaps the pack, tex, obj and game keys for the menu_* ones and shows the menu; a start from the
# menu restarts the engine with "play:<level>:<difficulty>" and the keys below (the campaign's own packs: assets/hp2/<map>.*).
menu 1
menu_pack assets/hp2/ui.hp2
menu_tex assets/hp2/ui.tex.hp2
menu_obj assets/hp2/ui.obj.hp2
menu_game assets/hp2/ui
pack assets/hp2/a10.hp2
tex assets/hp2/a10.tex.hp2
obj assets/hp2/a10.obj.hp2
game assets/hp2/a10
overlay 0
fps 30
bot 0
